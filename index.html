<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="google-site-verification" content="xD9GectHgVW0YQIOhxM4IUDfch4wVi_d6mXxcqJ-KyM" />
  
  <!-- Primary SEO Meta Tags -->
  <title>TaskChime - Simple & Fast Daily Task Manager</title>
  <meta name="description" content="TaskChime helps you organize daily tasks, track priorities, set alarms, and boost your daily productivity easily.">
  <meta name="robots" content="index, follow"> <!-- tells search engines to index and follow links on this page -->
  <meta name="theme-color" content="#18181b"> <!-- matches mobile browser toolbar color with page background -->

  <!-- Canonical URL to tell search engines the official address of this page -->
  <link rel="canonical" href="https://taskchime.vercel.app/">

  <!-- Favicon: shows your PNG logo on the browser tab -->
  <link rel="icon" type="image/png" href="assets/Logo.png">

  <!-- Open Graph / Facebook / WhatsApp (Generates rich card preview when sharing link) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="TaskChime">
  <meta property="og:title" content="TaskChime - Simple & Fast Daily Task Manager">
  <meta property="og:description" content="Organize daily tasks, track priorities, set alarms, and boost your daily productivity easily with TaskChime.">
  <meta property="og:image" content="assets/Logo.png">

  <!-- Twitter Card (Generates interactive preview card on X / Twitter) -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="TaskChime - Simple & Fast Daily Task Manager">
  <meta name="twitter:description" content="Organize daily tasks, track priorities, set alarms, and boost your daily productivity easily with TaskChime.">
  <meta name="twitter:image" content="assets/Logo.png">

  <!-- JSON-LD Structured Data: Tells Google search crawlers this is a Productivity Web Application -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "TaskChime",
    "url": "https://taskchime.vercel.app/",
    "applicationCategory": "Productivity",
    "operatingSystem": "All",
    "description": "A fast and simple daily task management web app to organize tasks, set priorities, and get reminders."
  }
  </script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="Header">
    <h1>TaskChime</h1>
    <p class="HeaderText">Organize your daily tasks and stay productive.</p>
  </header>

  <main>
    <section class="FormSection">
      <h2 class="SectionTitle">Add New Task</h2>

      <form class="Form">
        <div class="FormInfo">
          <div class="InputRow">
            <div class="FieldGroup">
              <label class="FieldLabel" for="task-input">Task</label>
              <textarea id="task-input" name="task" class="FieldControl TaskInput" placeholder="Enter task" rows="4"></textarea>
            </div>
            <div class="FieldGroup">
              <label class="FieldLabel" for="importance-input">Importance</label>
              <select id="importance-input" name="importance" class="FieldControl ImportanceInput">
                <option value="">Select importance</option>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
              </select>
            </div>
          </div>

          <div class="InputRow">
            <div class="FieldGroup">
              <label class="FieldLabel" for="date-input">Date</label>
              <input id="date-input" name="date" class="FieldControl DateInput" type="date">
            </div>
            <div class="FieldGroup">
              <label class="FieldLabel" for="time-input">Time</label>
              <input id="time-input" name="time" class="FieldControl TimeInput" type="time">
            </div>
          </div>

          <div class="FieldGroup">
            <label class="FieldLabel" for="place-input">Place</label>
            <input id="place-input" name="place" class="FieldControl PlaceInput" type="text" placeholder="Enter place">
          </div>

          <div class="Buttons FormButtons">
            <button class="Button AddButton" type="button">Add Todo</button>
            <button class="Button NotifyButton" type="button">Notification</button>
          </div>
        </div>
      </form>
    </section>







    <section class="TasksSection">
      <div class="TasksTop">
        <h2 class="SectionTitle">My Tasks</h2>
        <input id="search-input" name="search" class="SearchInput" type="search" placeholder="Search task..." aria-label="Search tasks">
      </div>

      <div class="FilterRow">
        <button class="FilterButton All Active" type="button">All</button>
        <button class="FilterButton High" type="button">High</button>
        <button class="FilterButton Medium" type="button">Medium</button>
        <button class="FilterButton Low" type="button">Low</button>
      </div>

      <div class="CardContainer"></div>
    </section>
  </main>

  <footer>
    <p class="FooterText">
      © 2026 TaskChime. All rights reserved.
    </p>
  </footer>

  <!-- Custom confirm modal (replaces native confirm()) -->
  <div class="ModalOverlay" hidden>
    <div class="Modal" role="dialog" aria-modal="true" aria-labelledby="ModalTitle">
      <h3 id="ModalTitle" class="ModalTitle">Delete this task?</h3>
      <p class="ModalText">This action cannot be undone.</p>
      <div class="Buttons ModalButtons">
        <button class="Button ModalCancelButton" type="button">Cancel</button>
        <button class="Button ModalDeleteButton" type="button">Delete</button>
      </div>
    </div>
  </div>
</body>
<script src="script.js"></script>
</html>
